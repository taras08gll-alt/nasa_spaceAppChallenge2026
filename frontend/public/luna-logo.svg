<!-- LUNA-DOC: Основний векторний логотип у верхньому меню; SVG додається як файл без растеризації. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 122" width="100%" height="100%">
  <defs>
    <!-- Градієнт місячного люмену -->
    <linearGradient id="lumenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Делікатне світіння (імітація люмену) -->
    <filter id="softLumen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Векторні літери LUN з фіксованим інтервалом 10px між символами -->
  <g fill="#F8FAFC">
    <!-- L (x: 16..42) -->
    <path d="M 16,30 H 22 V 62 H 42 V 68 H 16 Z" />
    
    <!-- U (x: 52..82, інтервал 10px) -->
    <path d="M 52,30 H 58 V 53 C 58,59 61,63 67,63 C 73,63 76,59 76,53 V 30 H 82 V 53 C 82,63 76,68.5 67,68.5 C 58,68.5 52,63 52,53 Z" />
    
    <!-- N (x: 92..122, інтервал 10px) -->
    <path d="M 92,30 H 98 L 116,58 V 30 H 122 V 68 H 116 L 98,40 V 68 H 92 Z" />
  </g>

  <!-- Літера A-спис (x: 132..162, інтервал рівно 10px від N) -->
  <g transform="translate(132, 30)" filter="url(#softLumen)">
    <!-- Наконечник (верхівка А) -->
    <polygon points="15,0 30,22 15,17 0,22" fill="url(#lumenGrad)" />
    <!-- Поперечина літери А -->
    <line x1="5" y1="26" x2="25" y2="26" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" />
    <!-- Древко списа -->
    <line x1="15" y1="16" x2="15" y2="38" stroke="url(#lumenGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Напис Spiculum через природний пробіл -->
  <text x="184" y="68" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="300" letter-spacing="2" fill="#CBD5E1">Spiculum</text>

  <!-- Розшифровка абревіатури по центру -->
  <text x="212" y="96" text-anchor="middle" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" letter-spacing="3.2" fill="#94A3B8">LUNAR UNIFIED NAVIGATIONAL ATLAS</text>
</svg>